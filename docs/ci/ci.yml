name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck · Lint · Migrate · Build · Tests · Security
    runs-on: ubuntu-latest

    # The BEYU OS test suite is not purely unit-level: tenant isolation, audit-chain
    # concurrency, atomic-transaction and governed-mutation suites assert against a
    # real PostgreSQL instance. A service container is therefore required, not
    # optional — mocking these would invalidate exactly the guarantees they prove.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyu_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # ------------------------------------------------------------------
      # CREDENTIAL SEPARATION — this is load-bearing, not cosmetic.
      #
      # RUNTIME role (DATABASE_URL) is the NON-SUPERUSER, RLS-bound role the
      # application request path uses. The server started below runs on it, so
      # the HTTP/E2E suite exercises real Row Level Security.
      #
      # ADMIN role (BEYU_ADMIN_DATABASE_URL) is the superuser used ONLY for
      # schema DDL, seeding and drizzle-kit.
      #
      # TEST role (BEYU_TEST_DATABASE_URL) is privileged because several
      # governed-mutation suites call domain services directly, without the
      # guarded() wrapper that establishes transaction-local RLS scope.
      #
      # BEYU_RUNTIME_DATABASE_URL pins the runtime DSN for the RLS and
      # runtime-privilege audit suites, which must connect as the runtime role
      # even in a test process where setup-env.ts repoints DATABASE_URL.
      #
      # These are CI-only literals, not secrets, and are never printed.
      # ------------------------------------------------------------------
      DATABASE_URL: postgresql://beyu_runtime:ci_runtime_db_password_not_a_secret@127.0.0.1:5432/beyu_os
      BEYU_RUNTIME_DATABASE_URL: postgresql://beyu_runtime:ci_runtime_db_password_not_a_secret@127.0.0.1:5432/beyu_os
      BEYU_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beyu_os
      BEYU_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beyu_os
      BEYU_RUNTIME_DB_PASSWORD: ci_runtime_db_password_not_a_secret
      BEYU_BOOTSTRAP_PASSWORD: ci_bootstrap_password_not_a_secret
      AUTH_SECRET: ci_auth_secret_value_used_only_in_continuous_integration
      MFA_ENCRYPTION_KEY: ci_mfa_encryption_key_used_only_in_integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply versioned migrations
        # scripts/migrate.ts is the only migration runner; drizzle-kit push is
        # never used against a managed database.
        run: npm run migrate

      - name: Verify no migration drift
        # drizzle-kit must agree the committed migrations fully describe the
        # schema. If it wants to generate a new migration, the journal or the
        # migrations are out of sync with src/db/schema.
        run: |
          set -euo pipefail
          before=$(ls drizzle/*.sql | wc -l)
          npx drizzle-kit generate --name=ci_drift_check
          after=$(ls drizzle/*.sql | wc -l)
          if [ "$before" != "$after" ]; then
            echo "::error::Migration drift detected — drizzle-kit generated a new migration."
            git --no-pager diff --stat
            exit 1
          fi
          echo "No migration drift."

      # MANDATORY, and it must run BEFORE the tests.
      #
      # Without it the runtime role does not exist, DATABASE_URL falls back to
      # the postgres superuser, and the security suites silently verify the
      # WRONG ROLE: runtime-privilege-audit fails on "cannot SET ROLE to a
      # superuser" (a superuser can), and the whole runtime-role RLS isolation
      # suite skips. The pipeline would then report a green build having proved
      # nothing about the role production actually runs as.
      - name: Provision non-superuser runtime role
        run: npx tsx scripts/setup-db-role.ts

      - name: Assert the runtime role is genuinely constrained
        # Independent re-check of the role attributes, so a regression in
        # setup-db-role.ts cannot pass unnoticed.
        run: |
          set -euo pipefail
          psql "$BEYU_ADMIN_DATABASE_URL" -Atqc \
            "select rolsuper||'|'||rolbypassrls||'|'||rolcreaterole||'|'||rolcreatedb
               from pg_roles where rolname='beyu_runtime'" \
            | grep -qx 'f|f|f|f' \
            || { echo "::error::runtime role is not NOSUPERUSER/NOBYPASSRLS/NOCREATEROLE/NOCREATEDB"; exit 1; }
          echo "Runtime role attributes verified: NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB."

      - name: Seed bootstrap data
        run: npm run seed

      - name: Production build
        run: npm run build

      # Deployment-platform build parity: production platforms (Vercel) build
      # WITHOUT runtime secrets. This step fails if any module regresses to
      # requiring DATABASE_URL at build time (the root cause that previously
      # failed every production deployment).
      - name: Production build without runtime secrets (deployment parity)
        env:
          DATABASE_URL: ""
          BEYU_RUNTIME_DATABASE_URL: ""
          BEYU_ADMIN_DATABASE_URL: ""
          BEYU_TEST_DATABASE_URL: ""
          AUTH_SECRET: ""
          MFA_ENCRYPTION_KEY: ""
          BEYU_BOOTSTRAP_PASSWORD: ""
        run: |
          set -euo pipefail
          mv .env /tmp/beyu-ci-env-backup 2>/dev/null || true
          trap 'mv /tmp/beyu-ci-env-backup .env 2>/dev/null || true' EXIT
          npm run build
          echo "Build succeeds without runtime secrets."

      # The end-to-end suite drives the real HTTP surface (401, the 422 forgery
      # guards, 429, idempotency replay/mismatch/cross-actor, page rendering and
      # navigation gating). Without a running server those tests skip, so CI
      # starts one and fails if it never becomes ready.
      - name: Start application for end-to-end tests
        run: |
          npx next start -H 127.0.0.1 -p 3100 &
          echo $! > /tmp/beyu-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::application did not become ready"; exit 1

      - name: Assert the server reports its database UP
        # A server that starts but cannot reach the database would let the E2E
        # suite skip instead of fail. Refuse to continue in that state.
        run: |
          set -euo pipefail
          body=$(curl -s http://127.0.0.1:3100/api/health)
          echo "$body" | grep -q '"database":"UP"' \
            || { echo "::error::/api/health did not report database UP: $body"; exit 1; }
          echo "Health: $body"

      - name: Tests
        # BEYU_TEST_BASE_URL is set explicitly, so tests/helpers/http.ts treats
        # an unreachable server as a FAILURE rather than skipping every
        # transport-level assertion.
        env:
          BEYU_TEST_BASE_URL: http://127.0.0.1:3100
        run: npm test

      - name: Stop application
        if: always()
        run: kill "$(cat /tmp/beyu-server.pid)" 2>/dev/null || true

      - name: Credential literal scan
        run: |
          set -euo pipefail
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
               -E "BeyuOS#|password\s*=\s*[\"'][^\"']{8,}" src/ scripts/ tests/; then
            echo "::error::Possible credential literal committed."
            exit 1
          fi
          echo "No credential literals found."

      - name: Committed-secret filename scan
        run: |
          set -euo pipefail
          if git ls-files | grep -qE '(^|/)\.env(\.|$)|\.pem$|\.key$|id_rsa'; then
            echo "::error::A credential-bearing file is tracked by git."
            git ls-files | grep -E '(^|/)\.env(\.|$)|\.pem$|\.key$|id_rsa'
            exit 1
          fi
          echo "No credential files tracked."

      # Supply-chain gate. Scoped to PRODUCTION dependencies and to critical
      # severity: dev-only advisories in build tooling are triaged deliberately
      # (see SECURITY.md) and must not turn the pipeline red on every upstream
      # publication, while a critical vulnerability in shipped runtime code must.
      - name: Production dependency audit (critical only)
        run: npm audit --omit=dev --audit-level=critical
