name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest

    # The BEYU OS test suite is not purely unit-level: tenant isolation, audit-chain
    # concurrency, atomic-transaction and governed-mutation suites assert against a
    # real PostgreSQL instance. A service container is therefore required, not
    # optional — mocking these would invalidate exactly the guarantees they prove.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyu_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/beyu_os
      # Non-production bootstrap values for CI only. Real secrets are never
      # committed and never printed (SECURITY.md).
      BEYU_BOOTSTRAP_PASSWORD: ci_bootstrap_password_not_a_secret
      AUTH_SECRET: ci_auth_secret_value_used_only_in_continuous_integration
      MFA_ENCRYPTION_KEY: ci_mfa_encryption_key_used_only_in_integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply versioned migrations
        # scripts/migrate.ts is the only migration runner; drizzle-kit push is
        # never used against a managed database.
        run: npm run migrate

      - name: Verify no migration drift
        # drizzle-kit must agree the committed migrations fully describe the
        # schema. If it wants to generate a new migration, the journal or the
        # migrations are out of sync with src/db/schema.
        run: |
          set -euo pipefail
          before=$(ls drizzle/*.sql | wc -l)
          npx drizzle-kit generate --name=ci_drift_check
          after=$(ls drizzle/*.sql | wc -l)
          if [ "$before" != "$after" ]; then
            echo "::error::Migration drift detected — drizzle-kit generated a new migration."
            git --no-pager diff --stat
            exit 1
          fi
          echo "No migration drift."

      - name: Seed bootstrap data
        run: npm run seed

      - name: Production build
        run: npm run build

      # Deployment-platform build parity: production platforms (Vercel) build
      # WITHOUT runtime secrets. This step fails if any module regresses to
      # requiring DATABASE_URL at build time (the root cause that previously
      # failed every production deployment).
      - name: Production build without runtime secrets (deployment parity)
        env:
          DATABASE_URL: ""
        run: |
          set -euo pipefail
          mv .env /tmp/beyu-ci-env-backup 2>/dev/null || true
          trap 'mv /tmp/beyu-ci-env-backup .env 2>/dev/null || true' EXIT
          npm run build
          echo "Build succeeds without runtime secrets."

      # The end-to-end suite drives the real HTTP surface (401, the 422 forgery
      # guards, idempotency replay/mismatch/cross-actor). Without a running server
      # those tests skip, so CI starts one and fails if it never becomes ready.
      - name: Start application for end-to-end tests
        run: |
          npx next start -H 127.0.0.1 -p 3100 &
          echo $! > /tmp/beyu-server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::application did not become ready"; exit 1

      - name: Tests
        env:
          BEYU_TEST_BASE_URL: http://127.0.0.1:3100
        run: npm test

      - name: Stop application
        if: always()
        run: kill "$(cat /tmp/beyu-server.pid)" 2>/dev/null || true

      - name: Credential literal scan
        run: |
          set -euo pipefail
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
               -E "BeyuOS#|password\s*=\s*[\"'][^\"']{8,}" src/ scripts/ tests/; then
            echo "::error::Possible credential literal committed."
            exit 1
          fi
          echo "No credential literals found."
