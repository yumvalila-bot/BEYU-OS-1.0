name: beyu_os_mobile
description: BEYU OS Mobile — Canonical enterprise control plane client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client
  dio: ^5.4.0
  
  # Secure storage
  flutter_secure_storage: ^9.0.0
  
  # State management
  provider: ^6.1.1
  
  # JSON serialization
  json_annotation: ^4.8.1
  
  # URL handling (deep links)
  uni_links: ^0.5.1
  
  # Logging
  logger: ^2.0.2
  
  # Date/time handling
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
