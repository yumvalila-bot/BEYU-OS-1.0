<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Noelia AI">
  <title>Noelia AI</title>
  <!--
    NOELIA AI — identity mark for small sizes (≤ 32px).
    Same identity cues as the full portrait: ivory field, gold ring,
    espresso hair with low bun, BEYU-navy blazer, gold studs.
    Deliberately higher contrast and fewer features so she remains
    recognizable at xs/sm sizes without distortion.
  -->
  <circle cx="32" cy="32" r="32" fill="#f6f0e4"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>

  <!-- blazer + blouse -->
  <path d="M10 64c3-15 13-21 22-21s19 6 22 21z" fill="#14284a"/>
  <path d="M25 43l7 10 7-10z" fill="#f8f4ec"/>

  <!-- ears + studs -->
  <circle cx="17.5" cy="29" r="3.4" fill="#b97e55"/>
  <circle cx="46.5" cy="29" r="3.4" fill="#b97e55"/>
  <circle cx="17.5" cy="33" r="1.6" fill="#d4af37"/>
  <circle cx="46.5" cy="33" r="1.6" fill="#d4af37"/>

  <!-- head -->
  <circle cx="32" cy="28" r="14.5" fill="#b97e55"/>

  <!-- hair: centre part + low bun -->
  <circle cx="32" cy="10" r="4.6" fill="#241b16"/>
  <path d="M32 11c-9.5 0-15.5 6-16 15 .1 1.8 2.3 2.1 3 .5 2.3-5.9 6.4-9.5 13-10.3 6.6.8 10.7 4.4 13 10.3.7 1.6 2.9 1.3 3-.5-.5-9-6.5-15-16-15z" fill="#241b16"/>
  <path d="M16.5 24c-1.2 5.4-1.2 11 .3 15.6.5 1.7 2.4 1.5 2.7-.3.7-4.6.7-9.4.1-14.2-.3-2.2-2.8-2.4-3.1-1.1z" fill="#241b16"/>
  <path d="M47.5 24c1.2 5.4 1.2 11-.3 15.6-.5 1.7-2.4 1.5-2.7-.3-.7-4.6-.7-9.4-.1-14.2.3-2.2 2.8-2.4 3.1-1.1z" fill="#241b16"/>

  <!-- calm features -->
  <circle cx="26.5" cy="29" r="1.9" fill="#2a1f19"/>
  <circle cx="37.5" cy="29" r="1.9" fill="#2a1f19"/>
  <path d="M27.5 36.5c2.6 2.6 6.4 2.6 9 0" stroke="#8d4f39" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
